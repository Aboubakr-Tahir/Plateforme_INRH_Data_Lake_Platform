services:
  # 1. Base relationnelle pour les Métadonnées & Dashboard Django
  postgres:
    image: postgres:15-alpine
    container_name: inrh_postgres
    restart: always
    environment:
      POSTGRES_DB: inrh_metadata
      POSTGRES_USER: inrh_admin
      POSTGRES_PASSWORD: inrh_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inrh_admin -d inrh_metadata"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Stockage Objet (Data Lake Bronze / Silver / Gold)
  minio:
    image: minio/minio:latest
    container_name: inrh_minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: inrh_minio_admin
      MINIO_ROOT_PASSWORD: inrh_minio_password
    ports:
      - "9000:9000"   # Port API S3 (pour Python / Pandas / boto3)
      - "9001:9001"   # Port Console Web (Interface graphique MinIO)
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 3. Message Broker pour Celery
  redis:
    image: redis:7-alpine
    container_name: inrh_redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  minio_data:
